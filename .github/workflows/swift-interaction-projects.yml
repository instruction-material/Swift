name: Swift course interactions
on:
  push:
    branches: [main]
    paths: ['SW6-Hobby-Structure/**', 'SW7-Favorite-Editor/**', 'SW14-Accessible-Tasks/**', '.github/workflows/swift-interaction-projects.yml']
  pull_request:
    paths: ['SW6-Hobby-Structure/**', 'SW7-Favorite-Editor/**', 'SW14-Accessible-Tasks/**', '.github/workflows/swift-interaction-projects.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pack: SW6-Hobby-Structure, app: HobbyMap}
          - {pack: SW7-Favorite-Editor, app: FavoriteNote}
          - {pack: SW14-Accessible-Tasks, app: TaskReview}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the starter and solution UI tests
        working-directory: ${{ matrix.pack }}
        env:
          APP: ${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          print(next(d["udid"] for runtime, group in json.load(sys.stdin)["devices"].items()
                     if ".iOS-" in runtime for d in group if d["name"].startswith("iPhone") and d["isAvailable"]))')
          xcrun simctl bootstatus "$device" -b
          for role in starter solution; do
            xcodebuild test -project "$role/$APP.xcodeproj" -scheme "$APP" -configuration Debug \
              -destination "id=$device" -parallel-testing-enabled NO \
              -derivedDataPath "$RUNNER_TEMP/$role" -resultBundlePath "$RUNNER_TEMP/$role.xcresult"
          done
